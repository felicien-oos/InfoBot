</head><style>

<body>
  <h1>🤖 Ma Mini IA</h1>
  <p>Pose-moi une question !</p>
  <input type="text" id="question" placeholder="Ex : Qui est le président de la France ?" size="50" />
  <button onclick="repondre()">Envoyer</button>
  <div id="reponse"></div>

  <script>
    const baseDeConnaissances = {
      "2 + 2": "4",
      "2+2": "4",
      "bonjour": "Salut ! Comment puis-je t'aider ?",
      "qui est le président de la france": "Emmanuel Macron",
      "quelle est la capitale du sénégal": "Dakar",
      "où est l'afrique": "En face de Madagascar, sur le continent africain.",
      "qui est le président de madagascar": "Andry Rajoelina",
      "parle moi en anglais": "Hello! How are you?",
      "parle moi en espagnol": "¡Hola! ¿Cómo estás?",
      "parle moi en chinois": "你好！你好吗？",
      "parle moi en allemand": "Hallo! Wie geht's?",
      "c'est quoi la svt": "C'est la science de la vie et de la Terre, comme les plantes, les animaux, les volcans...",
      "c'est quoi la géographie": "C’est l’étude des pays, des continents, des villes et des paysages.",
      "c'est quoi l'histoire": "C’est l’étude du passé des humains, des civilisations et des événements."
    };

    function repondre() {
  const question = document.getElementById("question").value.toLowerCase().trim();
  const reponse = baseDeConnaissances[question];
  const message = reponse || "Je ne connais pas encore cette réponse. Tu peux m'apprendre ?";
  document.getElementById("reponse").innerText = message;

  // Faire parler la réponse
  const synthese = window.speechSynthesis;
  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = "fr-FR";
  synthese.speak(utterance);
}

    }
  </script>
